name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install elan
        run: |
          curl -sSfL -o /tmp/elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install duckdb (differential-test oracle)
        run: |
          curl -sSfL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip
          sudo unzip -o -q /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Cache Lake packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.elan/toolchains
            .lake
            !.lake/packages/mathlib/.lake/build
          key: ${{ runner.os }}-lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Check axiom count ratchet (0) and theorem test-coverage ratchet (#181)
        run: |
          python3 tools/axiom_coverage_validator.py --runtime
          python3 tools/axiom_coverage_validator.py --runtime --theorems

      - name: Self-test the coverage validator's restore logic
        run: python3 tools/axiom_coverage_validator.py --self-test

      - name: Check definition coverage matrix
        run: python3 tools/definition_coverage_matrix.py --check

      - name: Check no theorem has identical sides (#307)
        run: python3 tools/rewrite-audit/scripts/lean/find_identical_sides.py SqlEquiv SqlCore SqlBridge

      - name: Check the trust-base test imports every bridge proof file
        run: python3 tools/check_trust_base_imports.py

      - name: Check generated AST DecidableEq block is current
        run: python3 tools/gen_ast_deceq.py --check

      - name: Build library
        run: lake build SqlEquiv

      - name: Get Mathlib cache (typed core, #287)
        # prebuilt Mathlib from cache.mathlib.org; its 6.7 GB build tree is
        # excluded from the Actions cache above and fetched here instead
        run: lake exe cache get

      - name: Build typed core and its tests
        run: lake build SqlCore sqlcore_test

      - name: Start Postgres (typed-core harness and Spider oracle, preinstalled on the runner)
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres createuser -s "$USER"
          sudo -u postgres createdb "$USER"
          psql -X -At -c 'select version()'

      - name: Run typed core tests
        run: |
          set -o pipefail
          lake exe sqlcore_test | tee /tmp/sqlcore_test.log
          grep -E "vs (DuckDB|Postgres|sqlite):" /tmp/sqlcore_test.log >> "$GITHUB_STEP_SUMMARY"

      - name: Build CLI
        run: lake build sql_equiv

      - name: Check Spider parse-rate ratchet
        run: python3 tools/spider_parse_baseline.py --check

      - name: Check Spider evaluate-rate ratchet
        run: python3 tools/spider_eval_baseline.py --check

      - name: Check Spider typed-core elaboration ratchet
        run: lake build spider_elab && python3 tools/spider_elab_baseline.py --check

      - name: Check typed-core coverage of the test corpus (phase 9 metric, #458)
        run: python3 tools/typed_corpus_baseline.py --check

      - name: Build tests
        run: lake build sql_equiv_test

      - name: Run tests
        run: |
          mkdir -p test-results
          TEST_RESULTS_JSON=test-results/unit.jsonl lake exe sql_equiv_test

      - name: Build LSpec property tests
        run: lake build sql_equiv_lspec

      - name: Self-test the LSpec run seed (#395)
        run: python3 tools/lspec_seed_selftest.py

      - name: Run LSpec property tests
        # Fixed seed (the default, 0) on pull requests; lspec-random.yml explores other seeds.
        # pipefail: without it the step takes tee's exit code and a failing property is green.
        run: |
          set -o pipefail
          lake exe sql_equiv_lspec | tee test-results/lspec.log
          python3 tools/lspec_results_to_json.py test-results/lspec.log test-results/lspec.jsonl
        env:
          LSPEC_SAMPLES: "100000"

      - name: Upload per-test results (#209)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: test-results-${{ github.run_id }}
          path: test-results/*.jsonl
