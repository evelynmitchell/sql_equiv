name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install elan
        run: |
          curl -sSfL -o /tmp/elan.tar.gz https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf /tmp/elan.tar.gz -C /tmp
          /tmp/elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Install duckdb (differential-test oracle)
        run: |
          curl -sSfL -o /tmp/duckdb.zip https://github.com/duckdb/duckdb/releases/download/v1.5.3/duckdb_cli-linux-amd64.zip
          sudo unzip -o -q /tmp/duckdb.zip -d /usr/local/bin
          duckdb --version

      - name: Cache Lake packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.elan/toolchains
            .lake
          key: ${{ runner.os }}-lake-${{ hashFiles('lakefile.toml', 'lean-toolchain') }}
          restore-keys: |
            ${{ runner.os }}-lake-

      - name: Check axiom coverage ratchet
        run: python3 tools/axiom_coverage_validator.py --runtime

      - name: Check definition coverage matrix
        run: python3 tools/definition_coverage_matrix.py --check

      - name: Build library
        run: lake build SqlEquiv

      - name: Build CLI
        run: lake build sql_equiv

      - name: Check Spider parse-rate ratchet
        run: python3 tools/spider_parse_baseline.py --check

      - name: Build tests
        run: lake build sql_equiv_test

      - name: Run tests
        run: lake exe sql_equiv_test

      - name: Build LSpec property tests
        run: lake build sql_equiv_lspec

      - name: Run LSpec property tests
        run: lake exe sql_equiv_lspec
        env:
          LSPEC_SAMPLES: "100000"
